services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardgame_db}
      POSTGRES_USER: ${POSTGRES_USER:-cardgame_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
        DROGON_REPOSITORY: ${DROGON_REPOSITORY:-https://github.com/drogonframework/drogon.git}
        TRANTOR_REPOSITORY: ${TRANTOR_REPOSITORY:-https://github.com/an-tao/trantor.git}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cardgame_db}
      POSTGRES_USER: ${POSTGRES_USER:-cardgame_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CARD_GAME_THREADS: ${CARD_GAME_THREADS:-2}
      CARD_GAME_LISTEN_ADDRESS: 0.0.0.0
      CARD_GAME_LISTEN_PORT: 5555
      CARD_GAME_CONFIG: /app/run/config.json
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
